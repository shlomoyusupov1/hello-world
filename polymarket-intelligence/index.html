<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Polymarket Intelligence</title><style>body{font-family:system-ui;background:#0b1220;color:#eef3ff;margin:0;padding:24px}main{max-width:1100px;margin:auto}.card{background:#17243b;padding:20px;border-radius:16px;margin:18px 0}button{background:#4386ff;color:white;border:0;border-radius:9px;padding:12px;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #38465c;text-align:right}a{color:#9ac4ff}.muted{color:#b4bfd1}.scroll{overflow:auto}</style><main><h1>Polymarket Intelligence — V1</h1><p class="muted">מעקב שווקים ציבוריים • ללא ביצוע עסקאות</p><div class="card"><button id="load">טען נתונים עדכניים</button><p id="status">ממתין לטעינה</p></div><div class="card"><h2>5 השווקים המובילים לפי נפח</h2><p class="muted">דירוג לפי נפח בלבד — אינו המלצת מסחר</p><div class="scroll"><table><thead><tr><th>שוק</th><th>מחיר YES</th><th>נפח $</th><th>נזילות $</th><th>החלטה</th></tr></thead><tbody id="rows"><tr><td colspan="5">אין נתונים</td></tr></tbody></table></div></div><div class="card"><h2>מנוע המלצות</h2><p>WAIT — עדיין אין הערכת הסתברות עצמאית או אימות יתרון לאחר עלויות.</p></div></main><script>const el=id=>document.getElementById(id);async function load(){el('status').textContent='טוען...';el('rows').replaceChildren();try{const r=await fetch('https://gamma-api.polymarket.com/markets?active=true&closed=false&limit=100');if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();const top=data.sort((a,b)=>Number(b.volumeNum||b.volume||0)-Number(a.volumeNum||a.volume||0)).slice(0,5);for(const m of top){const tr=document.createElement('tr');let p=[];try{p=JSON.parse(m.outcomePrices||'[]')}catch{};const values=[m.question||'ללא שם',p.length?(Number(p[0])*100).toFixed(1)+'%':'לא זמין',Number(m.volumeNum||m.volume||0).toLocaleString('en-US',{maximumFractionDigits:0}),Number(m.liquidityNum||m.liquidity||0).toLocaleString('en-US',{maximumFractionDigits:0}),'WAIT'];for(const v of values){const td=document.createElement('td');td.textContent=v;tr.append(td)}const a=document.createElement('a');a.textContent=values[0];a.href='https://polymarket.com/event/'+encodeURIComponent(m.slug||'');a.target='_blank';a.rel='noopener noreferrer';tr.firstChild.replaceChildren(a);el('rows').append(tr)}el('status').textContent='נטענו '+data.length+' שווקים; עודכן '+new Date().toLocaleString('he-IL')+'.';}catch(e){el('status').textContent='לא ניתן לטעון נתונים: '+e.message+'. ייתכן שהדפדפן חוסם גישה ל-API.';el('rows').innerHTML='<tr><td colspan="5">אין נתונים מאומתים</td></tr>'}}el('load').onclick=load;</script></html>
